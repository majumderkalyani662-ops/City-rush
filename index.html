<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Rush</title>
<style>
body {
  margin:0;
  background:#101426;
  color:white;
  text-align:center;
  font-family:Arial;
  overflow:hidden;
}
h2 {color:#00e5ff}
canvas {
  width:min(96vw,420px);
  height:auto;
  background:#87ceeb;
  touch-action:none;
  border:2px solid white;
}
button {
  padding:13px 25px;
  background:#00d9ff;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>🏃 CITY RUSH</h2>
<p>Swipe to move, jump and slide!</p>
<canvas id="game" width="420" height="650"></canvas>
<p>Score: <span id="score">0</span></p>
<button onclick="startGame()">START GAME</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let lane=1, jump=0, slide=0;
let score=0, speed=5, playing=false;
let obstacles=[],coins=[],frame=0;
let animation;

function xPos(l){return 100+l*110}

function draw(){
 ctx.clearRect(0,0,420,650);
 ctx.fillStyle="#80caff";
 ctx.fillRect(0,0,420,650);

 ctx.fillStyle="#555";
 ctx.beginPath();
 ctx.moveTo(135,0);
 ctx.lineTo(285,0);
 ctx.lineTo(420,650);
 ctx.lineTo(0,650);
 ctx.fill();

 ctx.strokeStyle="white";
 ctx.setLineDash([25,20]);
 ctx.beginPath();
 ctx.moveTo(185,0);
 ctx.lineTo(140,650);
 ctx.moveTo(235,0);
 ctx.lineTo(280,650);
 ctx.stroke();
 ctx.setLineDash([]);

 ctx.textAlign="center";
 obstacles.forEach(o=>{
  ctx.font="45px Arial";
  ctx.fillText(o.type,xPos(o.lane),o.y);
 });
 coins.forEach(c=>{
  ctx.font="30px Arial";
  ctx.fillText("🪙",xPos(c.lane),c.y);
 });

 ctx.font=slide>0?"35px Arial":"48px Arial";
 ctx.fillText("🏃",xPos(lane),540-jump);
}

function spawn(){
 obstacles.push({
  lane:Math.floor(Math.random()*3),
  y:-40,
  type:Math.random()<0.5?"🚧":"🚆"
 });
 if(Math.random()<0.8){
  coins.push({
   lane:Math.floor(Math.random()*3),
   y:-100
  });
 }
}

function update(){
 if(!playing)return;
 frame++;
 score++;
 speed=5+score/500;

 if(frame%55===0)spawn();

 obstacles.forEach(o=>o.y+=speed);
 coins.forEach(c=>c.y+=speed);

 obstacles=obstacles.filter(o=>o.y<700);
 coins=coins.filter(c=>c.y<700);

 obstacles.forEach(o=>{
  if(o.lane===lane && Math.abs(o.y-540)<35){
   if(jump<30 && slide<=0)endGame();
  }
 });

 coins=coins.filter(c=>{
  if(c.lane===lane && Math.abs(c.y-540)<35){
   score+=100;
   return false;
  }
  return true;
 });

 if(jump>0)jump-=5;
 if(slide>0)slide--;

 document.getElementById("score").innerText=score;
 draw();
 if(playing)animation=requestAnimationFrame(update);
}

function startGame(){
 cancelAnimationFrame(animation);
 lane=1;jump=0;slide=0;
 score=0;speed=5;frame=0;
 obstacles=[];coins=[];
 playing=true;
 update();
}

function endGame(){
 playing=false;
 cancelAnimationFrame(animation);
 draw();
 ctx.fillStyle="rgba(0,0,0,.8)";
 ctx.fillRect(0,0,420,650);
 ctx.fillStyle="white";
 ctx.font="38px Arial";
 ctx.fillText("GAME OVER",210,300);
 ctx.font="22px Arial";
 ctx.fillText("Score: "+score,210,350);
}

let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{
 e.preventDefault();
 sx=e.changedTouches[0].clientX;
 sy=e.changedTouches[0].clientY;
},{passive:false});

canvas.addEventListener("touchend",e=>{
 e.preventDefault();
 if(!playing)return;
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;

 if(Math.abs(dx)>Math.abs(dy)){
  if(dx>30)lane=Math.min(2,lane+1);
  if(dx<-30)lane=Math.max(0,lane-1);
 }else{
  if(dy<-30){jump=100;slide=0}
  if(dy>30){slide=25;jump=0}
 }
},{passive:false});

draw();
</script>
</body>
</html>
