(()=>{

const sun=new THREE.DirectionalLight(0xffedcf,3.0);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);

const laneX=[-2.6,0,2.6],trackParts=[];

for(let side of [-1,1])for(let i=0;i<22;i++){

function box(parent,w,h,d,material,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function makePerson(){
 const g=new THREE.Group();const torso=box(g,.66,.82,.38,shirt,0,1.45,0);torso.rotation.x=-.08;

const runner=makePerson();let lane=1,targetX=0,jumpY=0,vy=0,slideT=0,runT=0;
const obstacles=[],coins=[],effects=[],powerups=[],windBits=[];let magnetT=0,sneakerT=0,jetT=0,boardHits=0,boardT=0,shakeT=0,inspectorT=0,airJumps=0;

function makeBarrier(){let g=new THREE.Group();box(g,1.8,.22,.25,red,0,1.0,0);for(let s of [-.75,.75])box(g,.16,1.1,.18,white,s,.52,0);for(let s of [-.5,.5]){let stripe=box(g,.35,.23,.28,white,s,1.0,.02);stripe.rotation.z=-.5}return g}
function makeLow(){let g=new THREE.Group();box(g,2.1,.65,.5,blue,0,.42,0);box(g,2.2,.12,.58,white,0,.78,0);return g}
function addObstacle(){let l=Math.floor(Math.random()*3),r=Math.random(),type=r<.38?'train':r<.7?'barrier':r<.85?'low':'arch',obj=type==='train'?makeTrain():type==='barrier'?makeBarrier():makeLow();if(type==='arch'){obj=makeBarrier();obj.scale.y=.72;}obj.position.set(laneX[l],0,-92);scene.add(obj);obstacles.push({obj,l,type,z:-92,hit:false,moving:type==='train'&&Math.random()<.28,phase:Math.random()*6});

}
function sfx(freq=700,dur=.08,wave='sine',vol=.035){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function makePower(type,l,z){const colors={magnet:0xff4b88,sneakers:0x52f58c,jetpack:0xffb52e,board:0x42eaff,mult:0xffdf45,mystery:0xb56cff,key:0xffd34e};const g=new THREE.Group();const core=new THREE.Mesh(new THREE.OctahedronGeometry(.48,1),mat(colors[type],.3,.45));g.add(core);const ring=new THREE.Mesh(new THREE.TorusGeometry(.62,.055,8,24),mat(0xffffff,.35,.4));ring.rotation.x=Math.PI/2;g.add(ring);g.position.set(laneX[l],1.45,z);scene.add(g);powerups.push({obj:g,type,l,z,phase:Math.random()*6})}
let inspector=null,jetWasActive=false;
function showInspector(){if(!inspector){inspector=new THREE.Group();const coat=mat(0x202b45,.7),skin=mat(0xd9a47d);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.8,4,8),coat);body.position.y=1.05;inspector.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),skin);head.position.y=1.72;inspector.add(head);inspector.position.set(0,0,6.4);scene.add(inspector)}inspectorT=2.8;inspector.visible=true}
function burst(pos,color){puff(pos,color);for(let i=0;i<5;i++)puff(pos,color)}
function puff(pos,color=0xffd34e){for(let i=0;i<9;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),mat(color));m.position.copy(pos);scene.add(m);effects.push({m,v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*3),life:.6})}}
let mode='ready',score=0,coinCount=0,elapsed=0,spawnT=0,powerSpawnT=7,speed=22,last=0,stumbleT=0,audioCtx=null;
let totalCoins=Number(localStorage.getItem('cr_totalCoins')||0),keys=Number(localStorage.getItem('cr_keys')||0),tokens=Number(localStorage.getItem('cr_tokens')||0),multT=0,boardCharges=0,lastTap=0,selectedCrew='runner',mysteryCount=0;
$('keys').textContent=keys;
function setCrew(name){selectedCrew=name;const palettes={runner:{shirt:0xf07825,pants:0x183c69,cap:0xd73542},skater:{shirt:0x16bde0,pants:0x263047,cap:0x42e4bb},dj:{shirt:0x9b67f5,pants:0x171b2b,cap:0xffd447}};const c=palettes[name]||palettes.runner;runner.traverse(o=>{if(!o.isMesh)return;const col=o.material?.color;if(!col)return;const hex=col.getHex();if([0xf07825,0x16bde0,0x9b67f5].includes(hex))col.setHex(c.shirt);else if([0x183c69,0x263047,0x171b2b].includes(hex))col.setHex(c.pants);else if([0xd73542,0x42e4bb,0xffd447].includes(hex))col.setHex(c.cap)});document.querySelectorAll('.crew').forEach(b=>b.style.outline=b.dataset.crew===name?'3px solid white':'none')}
document.querySelectorAll('.crew').forEach(b=>b.onclick=()=>setCrew(b.dataset.crew));setCrew('runner');
function begin(){mode='run';score=coinCount=elapsed=spawnT=0;powerSpawnT=5;magnetT=sneakerT=jetT=boardT=shakeT=inspectorT=0;boardHits=airJumps=0;jetWasActive=false;speed=22;lane=1;targetX=0;jumpY=vy=slideT=runT=0;runner.position.set(0,0,3.5);runner.rotation.set(0,0,0);runner.userData.torso.rotation.set(-.08,0,0);runner.userData.head.rotation.set(0,0,0);runner.userData.cap.rotation.set(0,0,0);runner.userData.legs.forEach(l=>l.rotation.set(0,0,0));runner.userData.arms.forEach(a=>a.rotation.set(0,0,0));runner.scale.set(1,1,1);for(let o of obstacles)scene.remove(o.obj);for(let c of coins)scene.remove(c.obj);for(let p of powerups)scene.remove(p.obj);powerups.length=0;obstacles.length=coins.length=0;if(inspector)inspector.visible=false;$('overlay').style.display='none';$('start').textContent='START RUN';last=performance.now()}
const $=id=>document.getElementById(id);

function move(d){if(mode!=='run')return;lane=Math.max(0,Math.min(2,lane+d));targetX=laneX[lane]}
function jump(){if(mode!=='run'||slideT>0)return;if(jumpY<=.02){vy=sneakerT>0?13:10;airJumps=0;sfx(520,.07,'triangle')}else if(sneakerT>0&&airJumps<1){vy=9;jumpY+=.12;airJumps++;sfx(760,.09,'triangle')}}

 }
 if(mode!=='run')return;elapsed+=dt;speed=Math.min(39,22+elapsed*.38);score=Math.floor(elapsed*speed*2*(multT>0?2:1));

 const stride=Math.sin(runT);
